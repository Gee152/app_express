name: Test Pipeline (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências do Frontend
        run: |
          cd front
          npm ci

      - name: Instalar navegadores do Playwright
        run: |
          cd front
          npx playwright install --with-deps

      - name: Executar testes Playwright
        run: |
          cd front
          npm run test:e2e
        env:
          CI: true

      - name: Upload de Relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 15

  test-backend:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do Backend
        run: |
          cd backend
          npm ci

      - name: Executar testes do Backend
        run: |
          cd backend
          npm test -- --passWithNoTests
